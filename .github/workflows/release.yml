name: Manual Version Release

on:
  workflow_dispatch:

concurrency:
  group: manual-version-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  manual-version-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js runtime
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate time-based version (UTC)
        id: version
        run: |
          VERSION="$(date -u +'%Y.%-m%d.%H%M')"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists (re-run within the same minute?). Wait a minute and retry."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated version: $VERSION"

      - name: Write version into package.json
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Run type check and lint
        run: pnpm run compile && pnpm run lint

      - name: Build Chrome extension
        run: pnpm run zip

      - name: Build Firefox extension
        run: pnpm run zip:firefox

      - name: Collect commits for changelog
        id: changelog
        run: |
          MAX=50
          PREV_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          TOTAL="$(git rev-list --count "$RANGE")"
          git log --pretty=format:'- %s (%h)' "$RANGE" | head -n "$MAX" > COMMITS.txt
          if [ "$TOTAL" -gt "$MAX" ]; then
            printf '\n- ...and %d more commits\n' "$((TOTAL - MAX))" >> COMMITS.txt
          fi
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Summarize commits with AI
        id: ai
        continue-on-error: true
        uses: actions/ai-inference@v2
        with:
          endpoint: https://api.deepseek.com
          token: ${{ secrets.DEEPSEEK_API_KEY }}
          model: deepseek-v4-flash
          max-completion-tokens: 1800
          temperature: 0
          system-prompt: |
            You write release notes for "LuminTime", a privacy-first browser extension.
            Input is a raw git commit list. Rewrite it into concise English release notes.
            Group items under markdown H2 headings: "## Features", "## Fixes", "## Other"
            (omit any empty group). Drop noise commits (chore/ci/docs/merge/release bump)
            unless meaningful. Keep each bullet short and user-facing. Keep the short
            commit hash in parentheses at the end of each bullet. Output ONLY the markdown,
            with no preamble, no code fences, no closing remarks.
          prompt-file: COMMITS.txt

      - name: Assemble release notes
        id: notes
        run: |
          CURRENT_TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG="${{ steps.changelog.outputs.prev_tag }}"
          AI_FILE="${{ steps.ai.outputs.response-file }}"

          {
            echo "## Highlights"
            echo "- Release ${CURRENT_TAG}"
            echo
            if [ "${{ steps.ai.outcome }}" = "success" ] && [ -n "$AI_FILE" ] && [ -s "$AI_FILE" ]; then
              cat "$AI_FILE"
            else
              echo "## Commits"
              cat COMMITS.txt
            fi
            echo
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$CURRENT_TAG"
            fi
          } > RELEASE_NOTES.md

          echo "notes_file=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish versioned release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ steps.commit.outputs.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            .output/*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old releases (keep latest 3)
        run: |
          OLD_TAGS="$(gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName')"
          if [ -z "$OLD_TAGS" ]; then
            echo "Nothing to prune; 3 or fewer releases exist."
            exit 0
          fi
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Deleting old release and tag: $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done <<< "$OLD_TAGS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
